<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Architectural Land & Layout Studio</title>

  <!-- Leaflet & Drawing Plugins -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, #map { height: 100vh; width: 100vw; overflow: hidden; background: #000; }

    #sidebar {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 16px;
      border-radius: 12px;
      z-index: 1000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      width: 310px;
      max-height: 94vh;
      overflow-y: auto;
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
    }
    h2 { font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    
    .metric-card {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      margin-bottom: 10px;
    }
    .metric { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .metric-name { color: #94a3b8; }
    .metric-value { font-weight: 600; color: #f8fafc; }

    .nav-box { display: flex; gap: 6px; margin-bottom: 8px; }
    input[type="text"] {
      flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 12px; outline: none;
    }

    button {
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
      font-size: 12px; padding: 8px 12px; transition: 0.2s;
    }
    .btn-nav { background: #0284c7; color: #fff; }
    .btn-nav:hover { background: #0369a1; }
    
    .btn-gps-toggle {
      width: 100%;
      padding: 9px;
      font-size: 12px;
      margin-bottom: 6px;
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-gps-toggle.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .btn-tag-corner {
      width: 100%;
      padding: 8px;
      font-size: 11px;
      margin-bottom: 8px;
      background: #475569;
      color: #fff;
    }
    .btn-tag-corner:hover { background: #64748b; }

    .btn-generate {
      background: #8b5cf6; color: #fff; width: 100%; padding: 10px; font-size: 13px; margin-bottom: 8px;
    }
    .btn-generate:hover { background: #7c3aed; }

    .btn-kml {
      background: #10b981; color: #fff; width: 100%; padding: 10px; font-size: 13px; margin-bottom: 8px;
    }
    .btn-kml:hover { background: #059669; }

    .legend {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; font-size: 11px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .color-box { width: 12px; height: 12px; border-radius: 2px; }
    .guide { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-top: 8px; border-top: 1px solid #334155; padding-top: 6px; }

    .gps-marker-icon {
      width: 14px;
      height: 14px;
      background: #007aff;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 122, 255, 0.9);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(0, 122, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0); }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Architect Layout Studio</h2>

    <div class="nav-box">
      <input type="text" id="coordInput" placeholder="Lat, Long (e.g. 17.2472, 80.1514)" />
      <button class="btn-nav" onclick="flyToLocation()">Fly</button>
    </div>

    <!-- GPS Toggle & Pin Controls -->
    <button id="gpsToggleBtn" class="btn-gps-toggle" onclick="toggleGPS()">
      <span id="gpsStatusDot">⚪</span> 📍 Toggle My Live Location
    </button>
    <button class="btn-tag-corner" onclick="tagCurrentGPSCorner()">
      📌 Pin Corner at My Current Spot
    </button>

    <div class="metric-card">
      <div class="metric"><span class="metric-name">Total Extent:</span><span class="metric-value" id="val-acres">0.00 Acres</span></div>
      <div class="metric"><span class="metric-name">Guntas:</span><span class="metric-value" id="val-guntas">0.00 Gts</span></div>
      <div class="metric"><span class="metric-name">Gross Sq. Yards:</span><span class="metric-value" id="val-sqyd">0 Sq.Yd</span></div>
      <div class="metric"><span class="metric-name">Est. 200yd Plots:</span><span class="metric-value" id="val-plotcount">0 Plots</span></div>
    </div>

    <button class="btn-generate" onclick="generateArchitectLayout()">⚡ Auto-Generate Master Plan</button>
    <button class="btn-kml" onclick="exportArchitecturalKML()">🌍 Export 3D Google Earth KML</button>

    <div class="legend">
      <div class="legend-item"><div class="color-box" style="background:#f59e0b"></div> Villa Plots</div>
      <div class="legend-item"><div class="color-box" style="background:#64748b"></div> 40ft Spine Road</div>
      <div class="legend-item"><div class="color-box" style="background:#22c55e"></div> Park / Open Space</div>
      <div class="legend-item"><div class="color-box" style="background:#ef4444"></div> Utility / Water Tank</div>
    </div>

    <div class="guide">
      • Toggle GPS ON to track your spot live.<br>
      • Use <strong>Pin Corner</strong> to capture survey stones while walking.
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    var map = L.map('map').setView([17.2472, 80.1514], 16);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri World Imagery'
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(map);

    map.pm.addControls({
      position: 'topleft',
      drawPolygon: true,
      drawRectangle: true,
      drawPolyline: false,
      drawCircle: false,
      drawMarker: false,
      drawCircleMarker: false,
      editMode: true,
      removalMode: true
    });

    var outerBoundaryLayer = null;
    var layoutFeatures = [];
    var layoutLayerGroup = L.layerGroup().addTo(map);

    map.on('pm:create', function(e) {
      if (outerBoundaryLayer) {
        map.removeLayer(outerBoundaryLayer);
        layoutLayerGroup.clearLayers();
        layoutFeatures = [];
      }
      outerBoundaryLayer = e.layer;
      calculateSiteMetrics(outerBoundaryLayer);

      outerBoundaryLayer.on('pm:edit', function() {
        calculateSiteMetrics(outerBoundaryLayer);
      });
    });

    function calculateSiteMetrics(layer) {
      var geojson = layer.toGeoJSON();
      var sqm = turf.area(geojson);
      var acres = sqm / 4046.8564;
      var guntas = acres * 40;
      var sqYards = sqm * 1.19599;
      var netSaleableYards = sqYards * 0.55;
      var estimatedPlots = Math.floor(netSaleableYards / 200);

      document.getElementById('val-acres').innerText = acres.toFixed(2) + ' Acres';
      document.getElementById('val-guntas').innerText = guntas.toFixed(1) + ' Gts';
      document.getElementById('val-sqyd').innerText = Math.round(sqYards).toLocaleString() + ' Sq.Yd';
      document.getElementById('val-plotcount').innerText = estimatedPlots + ' Plots';
    }

    function flyToLocation() {
      var val = document.getElementById('coordInput').value;
      var coords = val.split(',').map(function(s) { return parseFloat(s.trim()); });
      if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
        map.flyTo([coords[0], coords[1]], 17);
      } else {
        alert('Please enter coordinates like: 17.2472, 80.1514');
      }
    }

    // GPS Toggle Tracking Engine
    var isGPSTracking = false;
    var gpsWatchId = null;
    var gpsUserMarker = null;
    var gpsAccuracyCircle = null;
    var latestUserLatLng = null;

    function toggleGPS() {
      var btn = document.getElementById('gpsToggleBtn');
      if (!isGPSTracking) {
        if (!navigator.geolocation) {
          alert('Geolocation is not supported by your browser.');
          return;
        }

        gpsWatchId = navigator.geolocation.watchPosition(
          function(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;
            var acc = position.coords.accuracy;
            latestUserLatLng = [lat, lng];

            if (!gpsUserMarker) {
              map.flyTo([lat, lng], 18);
            }

            if (gpsUserMarker) map.removeLayer(gpsUserMarker);
            if (gpsAccuracyCircle) map.removeLayer(gpsAccuracyCircle);

            var icon = L.divIcon({
              className: 'gps-marker-icon',
              iconSize: [14, 14],
              iconAnchor: [7, 7]
            });

            gpsUserMarker = L.marker([lat, lng], { icon: icon }).addTo(map);
            gpsAccuracyCircle = L.circle([lat, lng], {
              radius: acc,
              color: '#38bdf8',
              fillColor: '#38bdf8',
              fillOpacity: 0.15,
              weight: 1
            }).addTo(map);

            gpsUserMarker.bindPopup("<b>Your Spot</b><br>Accuracy: " + Math.round(acc) + "m");
          },
          function(err) {
            alert('Location error: ' + err.message);
            stopGPS();
          },
          { enableHighAccuracy: true }
        );

        isGPSTracking = true;
        btn.classList.add('active');
        btn.innerHTML = '<span id="gpsStatusDot">🟢</span> 📍 GPS Tracking ON (Tap to Stop)';
      } else {
        stopGPS();
      }
    }

    function stopGPS() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      if (gpsUserMarker) { map.removeLayer(gpsUserMarker); gpsUserMarker = null; }
      if (gpsAccuracyCircle) { map.removeLayer(gpsAccuracyCircle); gpsAccuracyCircle = null; }

      isGPSTracking = false;
      var btn = document.getElementById('gpsToggleBtn');
      btn.classList.remove('active');
      btn.innerHTML = '<span id="gpsStatusDot">⚪</span> 📍 Toggle My Live Location';
    }

    var onSitePoints = [];
    var onSitePinsGroup = L.layerGroup().addTo(map);

    function tagCurrentGPSCorner() {
      if (!latestUserLatLng) {
        alert('Turn ON "Toggle My Live Location" first to grab coordinates.');
        return;
      }

      onSitePoints.push(latestUserLatLng);
      var pin = L.marker(latestUserLatLng).addTo(onSitePinsGroup);
      pin.bindPopup("<b>Corner #" + onSitePoints.length + "</b>").openPopup();

      if (onSitePoints.length >= 3) {
        if (outerBoundaryLayer) map.removeLayer(outerBoundaryLayer);
        outerBoundaryLayer = L.polygon(onSitePoints, { color: '#38bdf8', weight: 3, fillOpacity: 0.2 }).addTo(map);
        calculateSiteMetrics(outerBoundaryLayer);
      }
    }

    function generateArchitectLayout() {
      if (!outerBoundaryLayer) {
        alert('Draw your outer boundary first.');
        return;
      }

      layoutLayerGroup.clearLayers();
      layoutFeatures = [];

      var boundaryGeo = outerBoundaryLayer.toGeoJSON();
      var bbox = turf.bbox(boundaryGeo);
      var minX = bbox[0], minY = bbox[1], maxX = bbox[2], maxY = bbox[3];

      var rows = 5;
      var cols = 6;
      var dx = (maxX - minX) / cols;
      var dy = (maxY - minY) / rows;
      var plotIndex = 1;

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var cellBox = turf.bboxPolygon([
            minX + c * dx,
            minY + r * dy,
            minX + (c + 1) * dx,
            minY + (r + 1) * dy
          ]);

          var intersection = turf.intersect(boundaryGeo, cellBox);

          if (intersection) {
            var type = 'plot';
            var color = '#f59e0b';
            var name = 'Plot ' + plotIndex;

            if (r === 2) {
              type = 'road';
              color = '#64748b';
              name = '40ft Master Spine Road';
            } else if (r === 0 && c <= 1) {
              type = 'park';
              color = '#22c55e';
              name = 'Public Park & Open Space';
            } else if (r === 0 && c === 2) {
              type = 'utility';
              color = '#ef4444';
              name = 'Utility Bay (OHT & Transformer)';
            } else {
              plotIndex++;
            }

            intersection.properties = {
              name: name,
              type: type,
              color: color,
              areaSqYards: Math.round(turf.area(intersection) * 1.19599)
            };

            layoutFeatures.push(intersection);

            L.geoJSON(intersection, {
              style: {
                color: '#ffffff',
                weight: 1.5,
                fillColor: color,
                fillOpacity: 0.65
              }
            }).bindPopup('<b>' + name + '</b><br>' + intersection.properties.areaSqYards + ' Sq.Yards').addTo(layoutLayerGroup);
          }
        }
      }
    }

    function exportArchitecturalKML() {
      if (layoutFeatures.length === 0) {
        alert('Generate the layout plan first.');
        return;
      }

      var placemarks = '';
      layoutFeatures.forEach(function(feat) {
        var name = feat.properties.name;
        var type = feat.properties.type;
        var sqyd = feat.properties.areaSqYards;

        var kmlColor = 'b30b9ef5';
        var height = '7';

        if (type === 'road') { kmlColor = 'b38b7464'; height = '0.5'; }
        if (type === 'park') { kmlColor = 'b35ec522'; height = '0.2'; }
        if (type === 'utility') { kmlColor = 'b34444ef'; height = '14'; }

        var geom = feat.geometry;
        var coordsArray = (geom.type === 'Polygon') ? geom.coordinates[0] : geom.coordinates[0][0];

        var coordString = coordsArray.map(function(c) {
          return c[0] + ',' + c[1] + ',' + height;
        }).join(' ');

        placemarks += `
        <Placemark>
          <name>${name} (${sqyd} Sq.Yd)</name>
          <Style>
            <LineStyle><color>ffffffff</color><width>2</width></LineStyle>
            <PolyStyle><color>${kmlColor}</color><fill>1</fill><outline>1</outline></PolyStyle>
          </Style>
          <Polygon>
            <extrude>1</extrude>
            <altitudeMode>relativeToGround</altitudeMode>
            <outerBoundaryIs>
              <LinearRing><coordinates>${coordString}</coordinates></LinearRing>
            </outerBoundaryIs>
          </Polygon>
        </Placemark>`;
      });

      var kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Architectural Master Plan</name>
    <open>1</open>
    ${placemarks}
  </Document>
</kml>`;

      var blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Architectural_Master_Plan.kml';
      link.click();
    }
  </script>
</body>
</html>
