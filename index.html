<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Architectural Land & Layout Generator</title>

  <!-- Leaflet & Drawing Tool Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, #map { height: 100vh; width: 100vw; overflow: hidden; }

    /* Architect Control Dashboard */
    #sidebar {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 18px;
      border-radius: 12px;
      z-index: 1000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      width: 320px;
      max-height: 94vh;
      overflow-y: auto;
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
    }
    h2 { font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    
    .metric-card {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      margin-bottom: 10px;
    }
    .metric { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .metric-name { color: #94a3b8; }
    .metric-value { font-weight: 600; color: #f8fafc; }

    .nav-box { display: flex; gap: 6px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 12px; outline: none;
    }

    button {
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
      font-size: 12px; padding: 8px 12px; transition: 0.2s;
    }
    .btn-nav { background: #0284c7; color: #fff; }
    .btn-nav:hover { background: #0369a1; }
    
    .btn-generate {
      background: #8b5cf6; color: #fff; width: 100%; padding: 10px; font-size: 13px; margin-bottom: 8px;
    }
    .btn-generate:hover { background: #7c3aed; }

    .btn-kml {
      background: #10b981; color: #fff; width: 100%; padding: 10px; font-size: 13px; margin-bottom: 8px;
    }
    .btn-kml:hover { background: #059669; }

    .legend {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; font-size: 11px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .color-box { width: 12px; height: 12px; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Architect Layout Studio</h2>

    <!-- Coordinate Jump -->
    <div class="nav-box">
      <input type="text" id="coordInput" placeholder="Lat, Long (e.g. 17.25, 80.15)" />
      <button class="btn-nav" onclick="flyToLocation()">Fly</button>
    </div>

    <!-- Boundary Measurements -->
    <div class="metric-card">
      <div class="metric"><span class="metric-name">Total Extent:</span><span class="metric-value" id="val-acres">0.00 Acres</span></div>
      <div class="metric"><span class="metric-name">Guntas:</span><span class="metric-value" id="val-guntas">0.00 Gts</span></div>
      <div class="metric"><span class="metric-name">Gross Sq. Yards:</span><span class="metric-value" id="val-sqyd">0 Sq.Yd</span></div>
      <div class="metric"><span class="metric-name">Estimated Plots:</span><span class="metric-value" id="val-plotcount">0 Plots</span></div>
    </div>

    <!-- Generator Actions -->
    <button class="btn-generate" onclick="generateArchitectLayout()">⚡ Auto-Generate Master Plan</button>
    <button class="btn-kml" onclick="exportArchitecturalKML()">🌍 Export 3D Google Earth KML</button>

    <!-- Map Legend -->
    <div class="legend">
      <div class="legend-item"><div class="color-box" style="background:#f59e0b"></div> Residential Plots</div>
      <div class="legend-item"><div class="color-box" style="background:#64748b"></div> 40ft Spine Road</div>
      <div class="legend-item"><div class="color-box" style="background:#22c55e"></div> Park / Open Space</div>
      <div class="legend-item"><div class="color-box" style="background:#ef4444"></div> Utility / OHT Tank</div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet, Geoman Toolbar, Turf.js Spatial Math -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    var map = L.map('map').setView([17.2472, 80.1514], 16);

    // High-resolution Satellite Imagery
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri Satellite'
    }).addTo(map);

    // Drawing Toolbar
    map.pm.addControls({
      position: 'topleft',
      drawPolygon: true,
      drawRectangle: true,
      drawPolyline: false,
      editMode: true,
      removalMode: true
    });

    var outerBoundaryLayer = null;
    var layoutFeatures = []; // Stores generated plots, roads, and amenities
    var layoutLayerGroup = L.layerGroup().addTo(map);

    map.on('pm:create', function(e) {
      if (outerBoundaryLayer) {
        map.removeLayer(outerBoundaryLayer);
        layoutLayerGroup.clearLayers();
        layoutFeatures = [];
      }
      outerBoundaryLayer = e.layer;
      calculateSiteMetrics(outerBoundaryLayer);

      outerBoundaryLayer.on('pm:edit', function() {
        calculateSiteMetrics(outerBoundaryLayer);
      });
    });

    function calculateSiteMetrics(layer) {
      var geojson = layer.toGeoJSON();
      var sqm = turf.area(geojson);
      var acres = sqm / 4046.8564;
      var guntas = acres * 40;
      var sqYards = sqm * 1.19599;

      // Net saleable area formula: ~55% of gross land / standard 220 Sq.Yard villa plot
      var netSaleableYards = sqYards * 0.55;
      var estimatedPlots = Math.floor(netSaleableYards / 220);

      document.getElementById('val-acres').innerText = acres.toFixed(2) + ' Acres';
      document.getElementById('val-guntas').innerText = guntas.toFixed(1) + ' Gts';
      document.getElementById('val-sqyd').innerText = Math.round(sqYards).toLocaleString() + ' Sq.Yd';
      document.getElementById('val-plotcount').innerText = estimatedPlots + ' Plots';
    }

    function flyToLocation() {
      var val = document.getElementById('coordInput').value;
      var coords = val.split(',').map(function(s) { return parseFloat(s.trim()); });
      if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
        map.flyTo([coords[0], coords[1]], 17);
      } else {
        alert('Please enter coordinates in "Lat, Long" format.');
      }
    }

    // --- ARCHITECTURAL DIVISION ENGINE ---
    function generateArchitectLayout() {
      if (!outerBoundaryLayer) {
        alert('Draw your outer vacant land boundary first.');
        return;
      }

      layoutLayerGroup.clearLayers();
      layoutFeatures = [];

      var boundaryGeo = outerBoundaryLayer.toGeoJSON();
      var bbox = turf.bbox(boundaryGeo);
      var minX = bbox[0], minY = bbox[1], maxX = bbox[2], maxY = bbox[3];

      // Divide site into an architectural grid
      var rows = 5;
      var cols = 6;
      var dx = (maxX - minX) / cols;
      var dy = (maxY - minY) / rows;
      var plotIndex = 1;

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var cellBox = turf.bboxPolygon([
            minX + c * dx,
            minY + r * dy,
            minX + (c + 1) * dx,
            minY + (r + 1) * dy
          ]);

          // Clip to actual surveyed polygon boundary
          var intersection = turf.intersect(boundaryGeo, cellBox);

          if (intersection) {
            var type = 'plot';
            var color = '#f59e0b';
            var name = 'Plot ' + plotIndex;

            // Row 2 is allocated for the 40ft Main Central Spine Road
            if (r === 2) {
              type = 'road';
              color = '#64748b';
              name = '40ft Master Spine Road';
            }
            // Corner allocated for Statutory Open Green Space (Park)
            else if (r === 0 && c <= 1) {
              type = 'park';
              color = '#22c55e';
              name = 'Public Park & Landscape';
            }
            // Corner allocated for Utility / Water Tank Substation
            else if (r === 0 && c === 2) {
              type = 'utility';
              color = '#ef4444';
              name = 'Utility Bay (OHT & Transformer)';
            } else {
              plotIndex++;
            }

            intersection.properties = {
              name: name,
              type: type,
              color: color,
              areaSqYards: Math.round(turf.area(intersection) * 1.19599)
            };

            layoutFeatures.push(intersection);

            // Render on map
            L.geoJSON(intersection, {
              style: {
                color: '#ffffff',
                weight: 1.5,
                fillColor: color,
                fillOpacity: 0.65
              }
            }).bindPopup('<b>' + name + '</b><br>Type: ' + type.toUpperCase() + '<br>Area: ' + intersection.properties.areaSqYards + ' Sq.Yds').addTo(layoutLayerGroup);
          }
        }
      }
    }

    // --- 3D GOOGLE EARTH KML GENERATION ---
    function exportArchitecturalKML() {
      if (layoutFeatures.length === 0) {
        alert('Generate the layout plan first.');
        return;
      }

      var placemarks = '';

      layoutFeatures.forEach(function(feat) {
        var name = feat.properties.name;
        var type = feat.properties.type;
        var sqyd = feat.properties.areaSqYards;

        // KML Color encoding (AABBGGRR in hex)
        var kmlColor = 'b30b9ef5'; // Plots: Orange
        var height = '8';          // 3D extrusion height in meters

        if (type === 'road') { kmlColor = 'b38b7464'; height = '0.5'; }
        if (type === 'park') { kmlColor = 'b35ec522'; height = '0.2'; }
        if (type === 'utility') { kmlColor = 'b34444ef'; height = '14'; } // Elevated tank height

        var geom = feat.geometry;
        var coordsArray = (geom.type === 'Polygon') ? geom.coordinates[0] : geom.coordinates[0][0];

        var coordString = coordsArray.map(function(c) {
          return c[0] + ',' + c[1] + ',' + height;
        }).join(' ');

        placemarks += `
        <Placemark>
          <name>${name} (${sqyd} Sq.Yd)</name>
          <description>Category: ${type.toUpperCase()}&#10;Estimated Footprint: ${sqyd} Sq. Yards</description>
          <Style>
            <LineStyle><color>ffffffff</color><width>2</width></LineStyle>
            <PolyStyle><color>${kmlColor}</color><fill>1</fill><outline>1</outline></PolyStyle>
          </Style>
          <Polygon>
            <extrude>1</extrude>
            <altitudeMode>relativeToGround</altitudeMode>
            <outerBoundaryIs>
              <LinearRing><coordinates>${coordString}</coordinates></LinearRing>
            </outerBoundaryIs>
          </Polygon>
        </Placemark>`;
      });

      var kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Master Architectural Layout Plan</name>
    <open>1</open>
    ${placemarks}
  </Document>
</kml>`;

      var blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Architectural_Master_Plan.kml';
      link.click();
    }
  </script>
</body>
</html>
