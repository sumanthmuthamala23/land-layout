<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Land & Layout Planner</title>

  <!-- CesiumJS 3D Globe Library (Free & Open Source) -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; }

    /* Control Dashboard */
    #dashboard {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      padding: 18px;
      border-radius: 12px;
      width: 310px;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
    }
    h2 { font-size: 15px; color: #38bdf8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1; padding: 8px 10px; background: #0f172a; border: 1px solid #475569;
      border-radius: 6px; color: #fff; font-size: 12px;
    }
    button {
      padding: 8px 12px; border: none; border-radius: 6px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-nav { background: #0284c7; color: #fff; }
    .btn-nav:hover { background: #0369a1; }
    .btn-action { background: #3b82f6; color: #fff; width: 100%; margin-bottom: 6px; }
    .btn-action:hover { background: #2563eb; }
    .btn-clear { background: #ef4444; color: #fff; width: 100%; margin-bottom: 10px; }
    .btn-clear:hover { background: #dc2626; }
    .stats { border-top: 1px solid #334155; padding-top: 10px; margin-top: 6px; font-size: 12px; }
    .stat-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .stat-label { color: #94a3b8; }
    .stat-val { font-weight: 600; color: #f8fafc; }
    .guide { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="dashboard">
    <h2>3D Land Boundary Planner</h2>

    <!-- Coordinate Jump -->
    <div class="row">
      <input type="text" id="coordsInput" placeholder="Lat, Long (e.g., 17.2472, 80.1514)">
      <button class="btn-nav" onclick="flyToSite()">Fly</button>
    </div>

    <!-- Controls -->
    <button id="drawBtn" class="btn-action" onclick="toggleDrawing()">Start Drawing Boundary</button>
    <button class="btn-clear" onclick="resetBoundary()">Clear Boundary</button>

    <!-- Measurement Stats -->
    <div class="stats">
      <div class="stat-item"><span class="stat-label">Acres:</span><span class="stat-val" id="acres">0.00</span></div>
      <div class="stat-item"><span class="stat-label">Guntas:</span><span class="stat-val" id="guntas">0.00</span></div>
      <div class="stat-item"><span class="stat-label">Sq. Yards (Gajalu):</span><span class="stat-val" id="sqyd">0.00</span></div>
      <div class="stat-item"><span class="stat-label">Sq. Meters:</span><span class="stat-val" id="sqm">0.00</span></div>
    </div>

    <div class="guide">
      <strong>3D Controls:</strong><br>
      • Left-click + Drag: Pan across terrain.<br>
      • Right-click + Drag (or Scroll): Zoom.<br>
      • Middle-click / CTRL + Left Drag: <strong>Tilt & Rotate 3D angle</strong>.
    </div>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // 1. Initialize 3D Globe with Free Open Imagery (No Tokens or Credit Cards Required)
    const viewer = new Cesium.Viewer('cesiumContainer', {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      }),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      selectionIndicator: false,
      timeline: false,
      animation: false,
      sceneModePicker: true,
      navigationHelpButton: false
    });

    // 2. Initial Camera View
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(80.1514, 17.2472, 2500) // Default elevation 2500m
    });

    let isDrawing = false;
    let boundaryPoints = [];
    let pointEntities = [];
    let boundaryPolygon = null;

    function flyToSite() {
      const val = document.getElementById('coordsInput').value;
      const parts = val.split(',').map(s => parseFloat(s.trim()));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(parts[1], parts[0], 1200),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-45) // 3D tilted view
          }
        });
      } else {
        alert("Enter coordinates in 'Latitude, Longitude' format.");
      }
    }

    function toggleDrawing() {
      isDrawing = !isDrawing;
      const btn = document.getElementById('drawBtn');
      if (isDrawing) {
        btn.innerText = "Finish Boundary";
        btn.style.background = "#10b981";
      } else {
        btn.innerText = "Start Drawing Boundary";
        btn.style.background = "#3b82f6";
        calculateMetrics();
      }
    }

    // Handle mouse clicks on 3D globe surface
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (movement) {
      if (!isDrawing) return;

      const earthPosition = viewer.scene.pickPosition(movement.position);
      if (Cesium.defined(earthPosition)) {
        boundaryPoints.push(earthPosition);

        // Add visual corner pin
        const point = viewer.entities.add({
          position: earthPosition,
          point: {
            pixelSize: 8,
            color: Cesium.Color.RED,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2
          }
        });
        pointEntities.push(point);

        // Render dynamic boundary outline
        if (boundaryPoints.length > 2 && !boundaryPolygon) {
          boundaryPolygon = viewer.entities.add({
            polygon: {
              hierarchy: new Cesium.CallbackProperty(() => new Cesium.PolygonHierarchy(boundaryPoints), false),
              material: Cesium.Color.CYAN.withAlpha(0.35),
              outline: true,
              outlineColor: Cesium.Color.CYAN,
              outlineWidth: 3
            }
          });
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    function resetBoundary() {
      isDrawing = false;
      document.getElementById('drawBtn').innerText = "Start Drawing Boundary";
      document.getElementById('drawBtn').style.background = "#3b82f6";

      boundaryPoints = [];
      pointEntities.forEach(p => viewer.entities.remove(p));
      pointEntities = [];
      if (boundaryPolygon) {
        viewer.entities.remove(boundaryPolygon);
        boundaryPolygon = null;
      }

      document.getElementById('acres').innerText = '0.00';
      document.getElementById('guntas').innerText = '0.00';
      document.getElementById('sqyd').innerText = '0.00';
      document.getElementById('sqm').innerText = '0.00';
    }

    // Planar polygon area estimation from 3D coordinates
    function calculateMetrics() {
      if (boundaryPoints.length < 3) return;

      let coords = boundaryPoints.map(p => {
        let carto = Cesium.Cartographic.fromCartesian(p);
        return [Cesium.Math.toDegrees(carto.longitude), Cesium.Math.toDegrees(carto.latitude)];
      });
      coords.push(coords[0]); // Close ring

      // Shoelace formula converted to approximate square meters
      let area = 0;
      for (let i = 0; i < coords.length - 1; i++) {
        let p1 = coords[i];
        let p2 = coords[i + 1];
        area += (p2[0] - p1[0]) * (2 + Math.sin(p1[1] * Math.PI / 180) + Math.sin(p2[1] * Math.PI / 180));
      }
      area = Math.abs(area * 6378137.0 * 6378137.0 / 4.0);

      const sqm = area;
      const acres = sqm / 4046.8564;
      const guntas = acres * 40;
      const sqyd = sqm * 1.19599;

      document.getElementById('sqm').innerText = sqm.toLocaleString(undefined, { maximumFractionDigits: 1 });
      document.getElementById('acres').innerText = acres.toFixed(3);
      document.getElementById('guntas').innerText = guntas.toFixed(2);
      document.getElementById('sqyd').innerText = sqyd.toLocaleString(undefined, { maximumFractionDigits: 0 });
    }
  </script>
</body>
</html>
